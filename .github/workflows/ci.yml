name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run (Actions → CI → Run workflow) also checks macOS; see check-macos.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          # Windows minutes cost more on private repos: newest Node only.
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck + eslint + prettier + unit tests (live E2E needs Google credentials and is skipped)
      - run: npm run check
      - run: npm run build

  # macOS is the development machine (check + live E2E run there before every PR). Hosted
  # macOS arm64 runners often sit in a capacity queue and get cancelled, so CI runs it only
  # on demand instead of blocking pull requests.
  check-macos:
    name: check (macos-latest, Node 24)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
